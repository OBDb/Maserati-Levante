generations:
  - name: "First Generation"
    start_year: 2016
    end_year: 2020
    description: "The Maserati Levante marked the storied Italian manufacturer's first entry into the luxury SUV segment after several concept iterations. Built on a modified version of the platform underpinning the Ghibli and Quattroporte sedans, it features distinctively Maserati styling with an aggressive front fascia, the brand's signature triple side vents, and a coupe-like sloping roofline. Launched with a 3.0-liter twin-turbocharged V6 engine in two states of tune: approximately 345 horsepower in the base model and 424 horsepower in the Levante S, both paired with an eight-speed ZF automatic transmission and standard Q4 intelligent all-wheel drive system. European markets additionally received a 3.0-liter V6 turbodiesel option. The interior showcases Italian luxury with premium leather, available Ermenegildo Zegna silk upholstery, genuine wood or carbon fiber trim, and a driver-focused cockpit featuring an 8.4-inch touchscreen infotainment system. All models feature an adaptive air suspension with adjustable ride height and electronically controlled damping. The Levante combines Maserati's sporting heritage with SUV practicality, featuring a perfect 50:50 weight distribution, limited-slip differential, and sophisticated torque vectoring for handling dynamics uncommon in the luxury SUV segment."

  - name: "First Generation (2021 Facelift)"
    start_year: 2021
    end_year: 2022
    description: "The 2021 facelift brought significant updates to the Levante, including revised exterior styling with a new front bumper design, updated grille, and refreshed headlight and taillight graphics. The interior received an upgraded infotainment system with a larger 10.1-inch touchscreen display featuring enhanced connectivity and over-the-air update capability. The driver assistance suite was significantly expanded, introducing Highway Assist for semi-autonomous driving, adaptive cruise control with stop-and-go functionality, lane keeping assist, and automated emergency braking. The mechanical lineup remained largely unchanged, continuing with the 3.0-liter twin-turbo V6 in various states of tune and the range-topping Trofeo variant with its Ferrari-built 3.8-liter twin-turbo V8 producing 580 horsepower. The adaptive air suspension and Q4 all-wheel drive system continued as standard features, maintaining the Levante's blend of luxury and performance SUV characteristics."

  - name: "First Generation (2023 Update)"
    start_year: 2023
    end_year: 2024
    description: "The 2023 model year brought the most significant mechanical update to the Levante lineup with the introduction of Maserati's MC20-derived 3.0-liter twin-turbocharged Nettuno V6 engine, borrowed from the MC20 supercar. In the Levante Modena, this advanced powerplant produces 550 horsepower and features technologies derived from Formula 1, including pre-chamber combustion technology. This engine replaced the previous 3.0-liter V6 in certain trim levels, offering enhanced performance and efficiency while maintaining the signature Maserati exhaust note. The exterior styling continued from the 2021 facelift, while the interior retained the 10.1-inch infotainment system with its comprehensive connectivity features. The range-topping Trofeo variant continued to offer the Ferrari-built 3.8-liter twin-turbo V8 producing 580 horsepower. Production continued through 2024, representing the final years of Levante manufacturing before the upcoming electric SUV replacement."